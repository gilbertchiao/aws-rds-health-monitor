name: Bug report
description: Something is not working as expected
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not include AWS account IDs, ARNs with account
        numbers, email addresses or credentials.** Redact them before posting.
        For security vulnerabilities, follow [SECURITY.md](../blob/main/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Deploy with EMAIL_RECIPIENTS=...
        2. Invoke the function
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant CloudWatch logs or error output
      description: Redact any sensitive values.
      render: shell
  - type: input
    id: commit
    attributes:
      label: Commit or version
      placeholder: e.g. c104889 or main as of 2026-11-01
  - type: input
    id: runtime
    attributes:
      label: Lambda runtime / Node.js version
      placeholder: e.g. nodejs20.x
  - type: input
    id: region
    attributes:
      label: AWS region
      placeholder: e.g. ap-northeast-1
